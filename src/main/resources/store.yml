# ============================================================
#  伺服器商店 /store
#
#  只賣建築材料，而且「只賣不收」—— 這裡是大沙幣的主要消耗管道。
#
#  ⚠ 定價鐵則
#  如果商店賣的方塊可以拆解成 sell.yml 裡收購的礦物，
#  那它的售價必須高於拆解價值，否則玩家就能：
#      買方塊 → 拆成礦物 → 賣回系統 → 賺差價 → 無限重複
#  這是無限印鈔機，會在幾天內毀掉整個經濟。
#
#  規則：商店價 >= 拆解後的礦物收購總值 x 1.5
#
#  插件啟動時會用 Minecraft 真實的合成表自動檢查一遍，
#  有問題會在 console 印警告並附上建議價格。
#  也可以隨時用 /eco audit 手動檢查。
#
#  ⚠ 自動檢查抓不到的兩種情況，加東西時要自己想：
#    1. 「挖下去會掉收購品」的方塊。例如紫水晶簇挖了會掉紫水晶，
#       任何 *_ORE 也一樣 —— 這些永遠不要上架。
#    2. 「刮掉氧化／脫蠟之後變成別的方塊」的銅。所有銅方塊變體
#       都能一路刮回銅方塊再拆成銅錠，所以整組都要用同一個安全價。
#
#  ⚠ 這裡刻意不賣的東西：
#    鑽石方塊、綠寶石方塊、獄髓方塊、遠古遺骸、各種原礦與礦石。
#    那些是「自己挖」的目標，上架就沒人下礦坑了。
#
#  改完用 /eco reload 生效。
# ============================================================

