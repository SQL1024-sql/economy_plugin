  # ------------------------------------------------------------
  #  礦物方塊
  #
  #  這幾樣可以拆回礦物，價格全部套用「拆解價值 × 1.5」算出來。
  #  如果你動了 sell.yml 的價格，這裡也一定要跟著改，
  #  啟動檢查會告訴你新的建議價。
  # ------------------------------------------------------------
  oreblock:
    name: '<light_purple>礦物方塊'
    icon: COPPER_BLOCK
    items:
      # 9 銅錠 × 4 = 36 → 至少 54
      COPPER_BLOCK:
        price: 54
        note: '拆解價值 36，安全價 54'
      # 4 石英 × 8 = 32 → 至少 48（原版其實不能拆，保守定價）
      QUARTZ_BLOCK:
        price: 48
        note: '拆解價值 32，安全價 48'
      CHISELED_QUARTZ_BLOCK:
        price: 48
      QUARTZ_PILLAR:
        price: 48
      # 9 煤炭 × 3 = 27 → 至少 41
      COAL_BLOCK:
        price: 41
        note: '拆解價值 27，安全價 41'
      # 9 紅石 × 3 = 27 → 至少 41
      REDSTONE_BLOCK:
        price: 41
        note: '拆解價值 27，安全價 41'
      # 4 紫水晶 × 6 = 24 → 至少 36
