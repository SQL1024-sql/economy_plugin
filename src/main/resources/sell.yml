# ============================================================
#  礦物收購 /sell
#
#  這是整個經濟裡「唯一」憑空生出大沙幣的地方。
#  系統只收購，永遠不賣礦物 —— 礦物是單程票，進了系統就出不來。
#  這樣就沒有任何可以來回套利的迴圈。
#
#  改完用 /eco reload 生效。
# ============================================================

enabled: true

# ------------------------------------------------------------
#  每日收購額度（大沙幣）
#
#  一個玩家一天最多能從賣礦物賺這麼多，台北時間午夜重置。
#  設 0 代表不限制（不建議）。
#
#  這是防「掛機農場 + 分身帳號」的硬上限。因為程式沒辦法分辨
#  一塊鐵錠是玩家挖來的還是鐵傀儡農場刷出來的，所以只能用額度
#  把每個帳號的最大產出封頂。
# ------------------------------------------------------------
daily-quota: 8000

# ------------------------------------------------------------
#  動態降價
#
#  每賣出 1 個，該礦物的「全服供給池」就 +1，價格隨之下滑；
#  供給池會自己排掉，停手一陣子價格就回升。
#
#  效果：全服狂挖鑽石 → 鑽石價自己掉下來 → 產出自動剎車，
#  你不用一直手動追著改 config。
#
#  price-floor-ratio : 價格最低跌到基礎價的幾成
#  recovery-hours    : 從「跌到下限」回到「頂點價格」要幾小時
#
#  recovery-hours 是直線排掉，不是半衰期 —— 半衰期永遠到不了 0，
#  講不出「幾小時後價格恢復正常」這種話。這裡是實打實的：
#  價格被打到下限之後，過 recovery-hours 就回到滿血。
#  賣得不夠多、只掉一半的話，回復時間也按比例縮短。
#
#  ⚠ 排掉的速度是按各礦物的 soft-cap 換算的，所以不管哪一種礦，
#    回復時間都一樣。調這個數字等於同時調全部。
#
#  ⚠ 如果賣的量遠超過打到下限所需（真的洪水），會比 recovery-hours 久，
#    那是故意的。等不及的話用管理面板的「手動刷新收購價」直接歸零。
#
#  可以用小數：0.5 = 半小時，2 = 兩小時。
# ------------------------------------------------------------
price-floor-ratio: 0.3
recovery-hours: 1.0

# ------------------------------------------------------------
#  收購清單
#
#  price    : 基礎單價（供給池空的時候的價格）
#  soft-cap : 全服要賣出這麼多個，價格才會壓到下限
#  tier     : 只是顯示用的標籤
#
#  ⚠ 分級的依據是「能不能無人值守量產」，不是稀有度：
#
#   A 安全   只能挖，做不出農場 → 可以給高價
#   B 半自動 有農場但要花力氣蓋、產速有限 → 中低價
#   C 全自動 掛機就會生，等於印鈔機 → 預設不收
#
#  下面 C 級的三項（鐵、金、綠寶石）我預設「註解掉不收」。
#  一台鐵傀儡農場掛一晚的產量，超過認真挖礦玩家一整個月，
#  而且系統無法分辨。真的要收就把註解拿掉，但價格請壓到很低，
#  並且務必留著 daily-quota。
# ------------------------------------------------------------
items:

  # ---------------- A 級：只能挖，安全 ----------------
  ANCIENT_DEBRIS:
    price: 500
    soft-cap: 300
    tier: 'A 只能挖'
  DIAMOND:
    price: 120
    soft-cap: 3000
    tier: 'A 只能挖'
  LAPIS_LAZULI:
    price: 12
    soft-cap: 20000
    tier: 'A 只能挖'
  QUARTZ:
    price: 8
    soft-cap: 30000
    tier: 'A 只能挖'

  # ---------------- B 級：有農場，但要成本 ----------------
  AMETHYST_SHARD:
    price: 6
    soft-cap: 25000
    tier: 'B 晶洞可重複收成'
  COPPER_INGOT:
    price: 4
    soft-cap: 40000
    tier: 'B 溺屍農場'
  REDSTONE:
    price: 3
    soft-cap: 50000
    tier: 'B 女巫塔'
  COAL:
    price: 3
    soft-cap: 50000
    tier: 'B 凋零骷髏農場'

  # ---------------- C 級：全自動化，預設不收 ----------------
  # 把註解拿掉就會開始收購，但請先想清楚上面那段警告。
  #
  # IRON_INGOT:
  #   price: 2
  #   soft-cap: 80000
  #   tier: 'C 鐵傀儡農場（掛機無限）'
  # GOLD_INGOT:
  #   price: 3
  #   soft-cap: 60000
  #   tier: 'C 豬布林塔（掛機無限）'
  # EMERALD:
  #   price: 2
  #   soft-cap: 60000
  #   tier: 'C 村民交易（無限刷）'
