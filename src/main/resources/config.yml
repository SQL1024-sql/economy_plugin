# ============================================================
#  DashaEconomy — 大沙幣經濟系統
#  適用：Paper 26.1.2（需要 Java 25）
#
#  這個檔案管：貨幣名稱、拍賣行、音效。
#  其他設定分在：
#    stocks.yml   — 股市、新聞、股票清單
#    sell.yml     — 礦物收購清單與價格
#    store.yml    — 伺服器商店商品與價格
#    messages.yml — 所有訊息文字
#
#  改完用 /eco reload 生效。
# ============================================================

# ------------------------------------------------------------
#  貨幣
#
#  大沙幣是「帳戶餘額」，不是背包裡的物品。
#  這一點是刻意的：
#    * 物品會被複製，複製物品就等於複製鈔票
#    * 拍賣行要能在玩家離線時收款，物品做不到
#    * 手續費要能真的把錢銷毀，而不是掉在地上
#    * /eco stats 要能算出全服總量，散在箱子裡的物品算不出來
#  玩家用 /money 查餘額。
# ------------------------------------------------------------
currency:
  display-name: '<gradient:#f6d365:#fda085>大沙幣</gradient>'
  symbol: '沙'

# ------------------------------------------------------------
#  拍賣行 /ah
#
#  玩家之間的交易本身是零和的 —— 錢只是換人拿，總量不變。
#  真正讓拍賣行變成「貨幣消耗管道」的是下面兩筆費用，而且
#  它們跟建材不一樣，永遠不會飽和：玩家蓋完房子就不買石頭了，
#  但只要伺服器還活著，交易就不會停。
# ------------------------------------------------------------
auction:
  # 每個玩家最多能同時上架幾筆。有 dasha.admin 的人不受限制。
  max-listings-per-player: 10

  # 上架後幾天自動下架。到期的物品會退回賣家的取貨箱（上架費不退）。
  # 設 0 代表永不過期。
  listing-days: 7

  # 檢查過期上架的間隔（分鐘）。
  expire-check-minutes: 5

  # 成交時要不要廣播給全伺服器。
  broadcast-trade: false

  # 上架費：開價的百分之幾，按下確認上架的當下就扣，賣不掉也不退。
  # 這同時也是防洗版上架的機制。
  listing-fee-percent: 1.0
  # 上架費的下限，避免開價 1 元的洗版上架完全免費。
  listing-fee-min: 1

  # 成交抽成：賣家實拿 = 開價 × (1 - 這個百分比)。
  sale-cut-percent: 5.0

  # 開價範圍
  min-price: 1
  max-price: 100000000

  # 一筆上架最多放幾個物品
  max-amount-per-listing: 512

  # 上架介面的調整步進
  amount-step: 1          # 左鍵 / 右鍵 加減幾個
  amount-step-shift: 8    # Shift+左鍵 / Shift+右鍵 加減幾個
  price-step: 10          # 左鍵 / 右鍵 加減多少大沙幣
  price-step-shift: 100   # Shift 版加減多少

  # 「參考行情」按鈕列出幾筆同類商品
  reference-listings: 5

# ------------------------------------------------------------
#  音效（Minecraft 音效 key，留空字串代表不播）
# ------------------------------------------------------------
sound:
  success: 'entity.player.levelup'
  fail: 'entity.villager.no'
  click: 'ui.button.click'

# ------------------------------------------------------------
#  通用
# ------------------------------------------------------------
general:
  # 每日限制（礦物收購額度、股票單日漲跌幅）在哪個時區換日。
  # 用 IANA 時區名稱，例如 Asia/Taipei、Asia/Tokyo、UTC。
  timezone: 'Asia/Taipei'

  # 每隔幾分鐘把餘額與上架資料寫進資料庫一次。
  # 記憶體才是真相來源，這只是耐久備份；數字越小當機時損失越少，
  # 但磁碟寫入越頻繁。
  autosave-minutes: 1

# ------------------------------------------------------------
#  介面
#
#  這裡只有「一次操作等於多少數量」，不含版面座標 ——
#  按鈕放在第幾格是寫死的，那是版面不是設定。
# ------------------------------------------------------------
gui:
  # 進度條（收購行情、每日額度）有幾格
  bar-width: 10

  store:
    left-click: 1          # 左鍵買幾個
    right-click: 16        # 右鍵買幾個
    shift-left-click: 64   # Shift+左鍵買幾個

  stock:
    click-shares: 1        # 左鍵買 / 右鍵賣 幾股
    shift-click-shares: 10 # Shift 版幾股

# ------------------------------------------------------------
#  報告與排行
# ------------------------------------------------------------
report:
  # /eco stats 不帶參數時看幾天
  default-days: 7
  # 管理面板右鍵看幾天
  long-days: 30
  # /eco stats 最多能往回看幾天
  max-days: 365

  # /eco top 預設顯示幾名、最多幾名
  top-default: 10
  top-max: 50

  # 新聞稽核紀錄一次列出幾筆
  news-audit-entries: 20

# ------------------------------------------------------------
#  反向通道守門員
# ------------------------------------------------------------
guard:
  # 商店價格至少要是「拆解後礦物價值」的幾倍才算安全。
  # 1.0 等於剛好打平（玩家白工但不虧），所以要留餘裕。
  # 調低會讓檢查變寬鬆，不建議低於 1.2。
  safety-factor: 1.5

# ------------------------------------------------------------
#  資料庫
# ------------------------------------------------------------
storage:
  # 股票交易紀錄保留幾筆，超過就從最舊的開始刪。
  transaction-log-limit: 20000

  # 單次歷史查詢最多回傳幾筆（/stock log、稽核紀錄的硬上限）
  max-query-entries: 100

  # 讀取資料庫最多等幾秒
  read-timeout-seconds: 20
  # 關服時等待寫入完成最多幾秒
  shutdown-wait-seconds: 15
