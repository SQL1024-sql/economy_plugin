# ============================================================
#  伺服器商店 /store
#
#  只賣建築材料，而且「只賣不收」—— 這裡是大沙幣的主要消耗管道。
#
#  ⚠ 定價鐵則
#  如果商店賣的方塊可以拆解成 sell.yml 裡收購的礦物，
#  那它的售價必須高於拆解價值，否則玩家就能：
#      買方塊 → 拆成礦物 → 賣回系統 → 賺差價 → 無限重複
#  這是無限印鈔機，會在幾天內毀掉整個經濟。
#
#  規則：商店價 ≥ 拆解後的礦物收購總值 × 1.5
#
#  插件啟動時會用 Minecraft 真實的合成表自動檢查一遍，
#  有問題會在 console 印警告並附上建議價格。
#  也可以隨時用 /eco audit 手動檢查。
#
#  改完用 /eco reload 生效。
# ============================================================

